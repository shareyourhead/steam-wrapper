[package]
name = "steam_wrapper"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "steam-wrapper"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
evdev = { version = "0.13.2", features = ["tokio"] }
indexmap = { version = "2.14.0", features = ["serde"] }
json5 = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
futures-util = "0.3"
